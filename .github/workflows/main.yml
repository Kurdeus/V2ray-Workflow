name: Merge and Health-check V2Ray Subscriptions

on:
  schedule:
    - cron: '0 */1 * * *'  # runs every hour
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push configs/healthy.txt back to the repo
    env:
      BASE_URLS: ${{ secrets.BASE_URLS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge all subscriptions
        run: |
          if [ -z "$BASE_URLS" ]; then
            echo "::error::The BASE_URLS secret is empty or not set. See README for setup."
            exit 1
          fi

          echo "Reading URLs from the BASE_URLS secret..."
          > all.txt   # clear / create temp merged file (not committed)

          while IFS= read -r url || [ -n "$url" ]; do
            # skip empty lines and comments
            [[ -z "$url" || "$url" == \#* ]] && continue

            echo "Fetching: $url"
            content=$(curl -fsSL --max-time 30 "$url" 2>/dev/null)

            if [ $? -eq 0 ] && [ -n "$content" ]; then
              echo "$content" >> all.txt
              echo "  ✓ OK"
            else
              echo "  ✗ Failed or empty — skipping"
            fi
          done <<< "$BASE_URLS"

          total=$(wc -l < all.txt)
          echo ""
          echo "Done. Total lines in all.txt: $total"

      - name: Download xray-knife
        run: |
          # --retry handles transient errors (e.g. GitHub's release CDN
          # occasionally returns a 504) by retrying with backoff instead of
          # failing the whole job on one bad request.
          curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            -o xray-knife.zip \
            https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -o xray-knife.zip
          chmod +x xray-knife

      - name: Stage 1 - keep configs with ping under 300ms
        run: |
          # --prescan does a fast liveness check first so dead configs are
          # dropped quickly, before the slower full connection test runs.
          # --mdelay 300 keeps only configs with a real ping under 300ms.
          ./xray-knife http \
            -f all.txt \
            -o stage1.txt \
            --prescan \
            --prescan-workers 30 \
            --mdelay 300 \
            -v || true

          if [ ! -f stage1.txt ]; then
            echo "No configs passed the ping filter — writing an empty file."
            > stage1.txt
          fi

          total=$(wc -l < stage1.txt)
          echo "Configs under 300ms: $total"

      - name: Stage 2 - speed test survivors and keep the top 100
        run: |
          mkdir -p configs

          if [ ! -s stage1.txt ]; then
            echo "No configs to speed-test — writing an empty configs/healthy.txt."
            > configs/healthy.txt
            exit 0
          fi

          # -S runs a real download/upload test (speed.cloudflare.com) on each
          # survivor. jsonl output carries the measured speed per config so we
          # can rank by it afterwards.
          ./xray-knife http \
            -f stage1.txt \
            -o stage2.jsonl \
            -x jsonl \
            -S \
            -v || true

          if [ ! -f stage2.jsonl ]; then
            echo "Speed test produced no results — writing an empty configs/healthy.txt."
            > configs/healthy.txt
            exit 0
          fi

          # keep only configs that actually passed, rank by download speed
          # (highest first), take the top 100, and write just the links.
          jq -r 'select(.status=="passed") | [.download, .link] | @tsv' stage2.jsonl \
            | sort -t$'\t' -k1,1 -rn \
            | head -n 100 \
            | cut -f2- > configs/healthy.txt

          total=$(wc -l < configs/healthy.txt)
          echo "Top configs by speed kept: $total"

      - name: Commit and push configs/healthy.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/healthy.txt
          # only commit if there are actual changes
          git diff --cached --quiet && echo "No changes — skipping commit." || \
            git commit -m "chore: update configs/healthy.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
